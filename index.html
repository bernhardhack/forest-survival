<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1410">
<link rel="manifest" href="./manifest.json">

<meta name="apple-mobile-web-app-title" content="Forest">
<title>Forest Survival</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#070d0a;overflow:hidden;touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#070d0a}
  #touch{position:fixed;inset:0;display:none;z-index:10}
  body.touch #touch{display:block}
  .zone{position:absolute;top:0;bottom:0;width:50%}
  #zoneMove{left:0}#zoneAim{right:0}
  .stick{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
    border:1px solid rgba(200,214,190,.16);background:rgba(200,214,190,.04);
    opacity:0;transition:opacity .12s ease;pointer-events:none}
  .stick.on{opacity:1}
  .nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
    background:rgba(200,214,190,.15);border:1px solid rgba(200,214,190,.28)}
  #zoneAim .nub{background:rgba(240,200,140,.16);border-color:rgba(240,200,140,.36)}
  #actBtn{position:fixed;right:22px;bottom:26px;width:88px;height:88px;border-radius:50%;
    border:2px solid rgba(240,200,140,.45);background:rgba(240,200,140,.12);
    display:none;align-items:center;justify-content:center;z-index:20;
    color:#f0c88c;font-size:11px;letter-spacing:.08em;text-transform:uppercase;text-align:center;
    padding:6px;line-height:1.25}
  body.touch #actBtn.show{display:flex}
  #actRing{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
  #hint{position:fixed;left:0;right:0;bottom:84px;text-align:center;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:rgba(200,214,190,.4);pointer-events:none;z-index:11;padding:0 120px}
  body.touch #hint{padding:0 130px 0 20px;text-align:left;bottom:84px}
  #invBar{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;display:none;gap:8px;z-index:20}
  body.playing #invBar{display:flex}
  .slot{width:68px;height:62px;border-radius:10px;border:1px solid rgba(200,214,190,.18);
    background:rgba(10,18,14,.74);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;color:rgba(210,222,200,.92);font-size:9px;letter-spacing:.05em;cursor:pointer;
    transition:border-color .18s ease, transform .12s ease}
  .slot .dot{width:11px;height:11px;border-radius:3px}
  .slot .n{font-size:14px;font-weight:600;line-height:1}
  .slot.empty{opacity:.3}
  .slot.flash{border-color:rgba(240,200,140,.95);transform:translateY(-4px)}
  .slot:active{transform:translateY(-2px)}
  #fsBtn{position:fixed;left:16px;top:16px;width:52px;height:52px;border-radius:10px;
    border:1px solid rgba(200,214,190,.22);background:rgba(10,18,14,.6);color:rgba(200,214,190,.75);
    display:none;align-items:center;justify-content:center;cursor:pointer;z-index:22;padding:0}
  body.playing #fsBtn{display:flex}
  body.fs #fsBtn, body.standalone #fsBtn{display:none}
  #fsBtn svg{width:22px;height:22px}
  #fsTip{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:16px;background:rgba(7,13,10,.93);z-index:45;color:rgba(210,222,200,.9);text-align:center;padding:0 34px}
  body.tip #fsTip{display:flex}
  #fsTip h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#f0d0a8}
  #fsTip p{font-size:12px;line-height:1.8;color:rgba(200,214,190,.72);max-width:330px}
  #fsTip button{margin-top:6px;padding:16px 30px;min-height:52px;border-radius:10px;
    border:1px solid rgba(200,214,190,.3);background:transparent;color:rgba(200,214,190,.8);
    font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
  #buildBtn{position:fixed;right:22px;top:18px;padding:16px 22px;min-height:52px;border-radius:10px;
    border:1px solid rgba(168,192,122,.45);background:rgba(168,192,122,.12);color:#bcd48e;
    font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;z-index:22;display:none}
  body.playing #buildBtn{display:block}
  #buildPanel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(7,13,10,.82);z-index:30;padding:20px}
  body.building #buildPanel{display:flex}
  #buildInner{width:100%;max-width:430px;background:rgba(12,20,15,.97);border:1px solid rgba(200,214,190,.16);
    border-radius:14px;padding:18px}
  #buildInner h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#bcd48e;margin-bottom:4px}
  #buildWood{font-size:10px;color:rgba(200,214,190,.55);margin-bottom:12px}
  .bItem{display:flex;align-items:center;gap:12px;padding:15px 14px;min-height:64px;border-radius:9px;
    border:1px solid rgba(200,214,190,.14);background:rgba(200,214,190,.04);margin-bottom:8px;cursor:pointer}
  .bItem .bIcon{width:26px;height:26px;border-radius:6px;flex:0 0 26px}
  .bItem .bName{font-size:11px;color:rgba(215,226,205,.95);letter-spacing:.04em}
  .bItem .bDesc{font-size:9px;color:rgba(200,214,190,.5);margin-top:3px;line-height:1.45}
  .bItem .bCost{margin-left:auto;font-size:11px;color:#cbbf9a;white-space:nowrap}
  .bItem.no{opacity:.4}
  .bItem.done{opacity:.5}
  .bItem.done .bCost{color:#8fc07a}
  #buildClose{width:100%;margin-top:6px;padding:16px;min-height:52px;border-radius:9px;border:1px solid rgba(200,214,190,.2);
    background:transparent;color:rgba(200,214,190,.7);font:inherit;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:18px;background:rgba(7,13,10,.94);z-index:50;color:rgba(210,222,200,.9);text-align:center;padding:0 30px}
  body.over #over{display:flex}
  #over h2{font-size:17px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:#f0d0a8}
  #over p{font-size:12px;line-height:1.7;color:rgba(200,214,190,.7);max-width:340px}
  #again{margin-top:6px;padding:18px 34px;min-height:56px;border-radius:10px;border:1px solid rgba(240,200,140,.5);
    background:rgba(240,200,140,.12);color:#f0c88c;font:inherit;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer}
  #rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    gap:14px;background:#070d0a;z-index:40;color:rgba(200,214,190,.45);font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;text-align:center;padding:0 32px}
  body.portrait.touch #rotate{display:flex}
  #rotate .glyph{width:46px;height:74px;border:1px solid rgba(200,214,190,.28);border-radius:6px;
    animation:tip 2.4s ease-in-out infinite}
  @keyframes tip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion:reduce){#rotate .glyph{animation:none;transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="zone" id="zoneMove"><div class="stick" id="stickMove"><div class="nub" id="nubMove"></div></div></div>
  <div class="zone" id="zoneAim"><div class="stick" id="stickAim"><div class="nub" id="nubAim"></div></div></div>
</div>
<div id="actBtn"><svg id="actRing" viewBox="0 0 92 92"><circle id="ringPath" cx="46" cy="46" r="45" fill="none" stroke="#f0c88c" stroke-width="3" stroke-linecap="round" transform="rotate(-90 46 46)"/></svg><span id="actLabel">pick</span></div>
<div id="hint">move · look · <span id="hintKey">E to pick, hold E to chop</span></div>
<div id="invBar">
  <div class="slot" data-item="berries"><span class="dot" style="background:#e2718f"></span><span class="n" id="nBerries">0</span><span>berries</span></div>
  <div class="slot" data-item="water"><span class="dot" style="background:#8fc6e0"></span><span class="n" id="nWater">0</span><span>water</span></div>
  <div class="slot" data-item="wood"><span class="dot" style="background:#cbbf9a"></span><span class="n" id="nWood">0</span><span>wood</span></div>
  <div class="slot" data-item="seeds"><span class="dot" style="background:#a8c07a"></span><span class="n" id="nSeeds">0</span><span>seeds</span></div>
</div>
<button id="fsBtn" title="Fullscreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div id="fsTip">
  <h3>Play with no browser bars</h3>
  <p>Tap the <strong>Share</strong> button in your browser, then choose <strong>Add to Home Screen</strong>. The game gets its own icon and opens with nothing else on the screen.</p>
  <button id="fsTipClose">Got it</button>
</div>
<button id="buildBtn">Build</button>
<div id="buildPanel"><div id="buildInner">
  <h3>Build your camp</h3>
  <div id="buildWood"></div>
  <div id="buildList"></div>
  <button id="buildClose">Close</button>
</div></div>
<div id="over">
  <h2>You didn't make it</h2>
  <p id="overText"></p>
  <button id="again">Try again</button>
</div>
<div id="rotate"><div class="glyph"></div><div>rotate device</div></div>

<script>
/* ============================================================
   FOREST SURVIVAL — Milestone 2
   World generation, berry bushes, a stream, chopping trees,
   permanent stumps, and an inventory.
   All the numbers you can change live in TUNING below.
   ============================================================ */

const TUNING = {
  viewW:640, viewH:360, tile:16,
  worldTilesX:150, worldTilesY:150,
  seed:20260814,

  treeDensity:0.055, clearingScale:0.055, clearingBias:0.42,
  bushDensity:0.010,          // berry bushes per tile in open ground
  richnessFalloff:520,        // px — resources get better further from home

  accel:1400, friction:1500, maxSpeed:90, playerRadius:5,

  coneAngle:0.50, coneRange:176, coneFeather:6,
  ambientRadius:30, gloom:0.80, shadowSoft:2.2,

  reach:26,                   // how close you must be to use something
  chopTime:2.2,               // seconds to fell a tree
  digTime:1.4,                // seconds to dig up a bush for seeds

  berriesPerBush:2, seedsPerTree:2, woodPerTree:3, seedsPerBush:1,
  carryMax:20,

  // --- animals and your pet ---
  animalCount:16,
  petHungerDrain:0.62,     // hunger lost per second (starts at 100)
  petEatAmount:38,         // hunger a berry gives back
  petFollowDist:26,
  petSpeed:98,
  hungryBelow:45,          // stops helping below this
  starvingBelow:14,        // lies down below this

  // --- you ---
  hungerDrain:0.30,        // per second, out of 100
  thirstDrain:0.44,
  eatBerry:26,             // hunger a berry gives you
  drinkWater:32,           // thirst a water gives you
  hurtRate:3.2,            // health lost per second when empty
  healRate:1.1,            // health gained per second when fed and watered
  healAbove:50,

  // --- camp ---
  costShelter:8, costFire:4, costPlot:3, costStorage:5,
  campRange:70,            // how close parts must be to the house
  campSpacing:110,         // houses can't be built on top of each other
  growTime:70,             // seconds for a planted seed to be ready
  cropYield:3,             // berries per grown plant
  storageBonus:15,
  fireLight:78,

  camLerp:7.5, fixedStep:1/60, maxFrameTime:.25,
};

/* ---------- random ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry32(TUNING.seed);
const NG=256, ngrid=new Float32Array(NG*NG);
for(let i=0;i<NG*NG;i++) ngrid[i]=rnd();
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
  const g=(a,b)=>ngrid[(((b%NG)+NG)%NG)*NG+(((a%NG)+NG)%NG)];
  const s=t=>t*t*(3-2*t), u=s(xf), v=s(yf);
  return g(xi,yi)*(1-u)*(1-v)+g(xi+1,yi)*u*(1-v)+g(xi,yi+1)*(1-u)*v+g(xi+1,yi+1)*u*v;
}

/* ---------- canvas ---------- */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
canvas.width=TUNING.viewW; canvas.height=TUNING.viewH; ctx.imageSmoothingEnabled=false;
const dark=document.createElement('canvas');
dark.width=TUNING.viewW; dark.height=TUNING.viewH;
const dctx=dark.getContext('2d');

let viewScale=1,viewLeft=0,viewTop=0;
function resize(){
  const vw=innerWidth,vh=innerHeight;
  let s=Math.min(vw/TUNING.viewW,vh/TUNING.viewH);
  if(s>=1) s=Math.floor(s);
  viewScale=s;
  canvas.style.width=Math.round(TUNING.viewW*s)+'px';
  canvas.style.height=Math.round(TUNING.viewH*s)+'px';
  const r=canvas.getBoundingClientRect(); viewLeft=r.left; viewTop=r.top;
  document.body.classList.toggle('portrait',vh>vw);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch) document.body.classList.add('touch');

/* ---------- world ---------- */
const W=TUNING.worldTilesX,H=TUNING.worldTilesY,T=TUNING.tile;
const worldW=W*T, worldH=H*T;
const floorTone=new Float32Array(W*H);
for(let i=0;i<W*H;i++) floorTone[i]=rnd();

// --- stream: a meandering ribbon of water across the map ---
const water=new Uint8Array(W*H);
(function carveStream(){
  let x=8, y=H*0.3+rnd()*H*0.4, dir=0;
  while(x<W-4){
    dir += (rnd()-0.5)*0.55;
    dir = Math.max(-0.8, Math.min(0.8, dir));
    y += dir;
    y = Math.max(6, Math.min(H-6, y));
    const wdt = 1.4 + vnoise(x*0.08, 7.3)*1.6;
    for(let o=-wdt;o<=wdt;o+=0.5){
      const ty=Math.round(y+o), tx=Math.round(x);
      if(tx>=0&&ty>=0&&tx<W&&ty<H) water[ty*W+tx]=1;
    }
    x += 0.5;
  }
})();
const isWaterAt=(px,py)=>{
  const tx=Math.floor(px/T), ty=Math.floor(py/T);
  if(tx<0||ty<0||tx>=W||ty>=H) return false;
  return water[ty*W+tx]===1;
};

const trees=[], bushes=[], stumps=[], ferns=[];
let spawnX=0, spawnY=0;

(function grow(){
  const target=Math.floor(W*H*TUNING.treeDensity);
  let guard=0;
  while(trees.length<target && guard<target*14){
    guard++;
    const x=rnd()*worldW, y=rnd()*worldH;
    if(isWaterAt(x,y)) continue;
    if(vnoise(x*TUNING.clearingScale/T*4, y*TUNING.clearingScale/T*4) < TUNING.clearingBias) continue;
    let ok=true;
    for(const t of trees){const dx=t.x-x,dy=t.y-y; if(dx*dx+dy*dy<260){ok=false;break;}}
    if(!ok) continue;
    const v=rnd();
    trees.push({x,y,canopy:11+v*8,trunk:3.2+v*1.8,tone:rnd(),lean:(rnd()-.5)*1.4,alive:true});
  }
  for(let i=0;i<W*H*0.09;i++) ferns.push({x:rnd()*worldW,y:rnd()*worldH,r:2+rnd()*3.5,t:rnd()});
})();

/* ---------- player spawn: an open spot near the middle ---------- */
(function spawn(){
  let best=null;
  for(let i=0;i<600;i++){
    const x=worldW*.36+rnd()*worldW*.28, y=worldH*.36+rnd()*worldH*.28;
    if(isWaterAt(x,y)) continue;
    let near=Infinity;
    for(const t of trees){const d=Math.hypot(t.x-x,t.y-y); if(d<near) near=d;}
    if(!best||near>best.near) best={x,y,near};
    if(near>50) break;
  }
  spawnX=best.x; spawnY=best.y;
})();

/* --- berry bushes: open ground, richer the further from home --- */
(function seedBushes(){
  const target=Math.floor(W*H*TUNING.bushDensity);
  let guard=0;
  while(bushes.length<target && guard<target*20){
    guard++;
    const x=rnd()*worldW, y=rnd()*worldH;
    if(isWaterAt(x,y)) continue;
    if(vnoise(x*TUNING.clearingScale/T*4, y*TUNING.clearingScale/T*4) > TUNING.clearingBias+0.14) continue;
    let ok=true;
    for(const t of trees){const dx=t.x-x,dy=t.y-y; if(dx*dx+dy*dy<200){ok=false;break;}}
    if(ok) for(const b of bushes){const dx=b.x-x,dy=b.y-y; if(dx*dx+dy*dy<700){ok=false;break;}}
    if(!ok) continue;
    const dist=Math.hypot(x-spawnX,y-spawnY);
    const rich=Math.min(1, dist/TUNING.richnessFalloff);
    bushes.push({x,y,alive:true,tone:rnd(),
      yield:TUNING.berriesPerBush+Math.round(rich*2), r:6+rnd()*3});
  }
})();

/* ---------- spatial buckets ---------- */
const BUCKET=64, bw=Math.ceil(worldW/BUCKET), bh=Math.ceil(worldH/BUCKET);
const buckets=Array.from({length:bw*bh},()=>[]);
for(const t of trees){buckets[Math.floor(t.y/BUCKET)*bw+Math.floor(t.x/BUCKET)].push(t);}
function treesNear(x,y,rad){
  const out=[];
  const x0=Math.max(0,Math.floor((x-rad)/BUCKET)),x1=Math.min(bw-1,Math.floor((x+rad)/BUCKET));
  const y0=Math.max(0,Math.floor((y-rad)/BUCKET)),y1=Math.min(bh-1,Math.floor((y+rad)/BUCKET));
  for(let by=y0;by<=y1;by++) for(let bx=x0;bx<=x1;bx++) out.push(...buckets[by*bw+bx]);
  return out;
}

/* ---------- animals ----------
   Every kind needs a different number of berries before it trusts you. */
const SPECIES=[
  {id:'rabbit',name:'rabbit',cost:3, sniff:360, speed:112, body:5.0, col:'#cbb89a', ear:'long'},
  {id:'fox',   name:'fox',   cost:6, sniff:560, speed:98,  body:6.0, col:'#c47a42', ear:'point'},
  {id:'deer',  name:'deer',  cost:10,sniff:780, speed:88,  body:7.2, col:'#8a7052', ear:'point'},
];
const NAMES=['Pip','Rusty','Moss','Bramble','Willow','Nutmeg','Scout','Clover','Hazel','Bean'];

const animals=[];
(function releaseAnimals(){
  let guard=0;
  while(animals.length<TUNING.animalCount && guard<TUNING.animalCount*40){
    guard++;
    const x=rnd()*worldW, y=rnd()*worldH;
    if(isWaterAt(x,y)) continue;
    if(Math.hypot(x-spawnX,y-spawnY)<90) continue;   // not right on top of you
    let ok=true;
    for(const t of trees){const dx=t.x-x,dy=t.y-y; if(dx*dx+dy*dy<220){ok=false;break;}}
    if(!ok) continue;
    const sp=SPECIES[Math.floor(rnd()*SPECIES.length)];
    animals.push({
      x,y,vx:0,vy:0, sp, fed:0, tame:false, wander:rnd()*Math.PI*2, wanderT:0,
      name:NAMES[Math.floor(rnd()*NAMES.length)], bob:rnd()*6,
    });
  }
})();

/* your pet: null until you tame one */
let pet=null;
let petGrave=null;        // where you lost your last friend
let petMessage=null, petMessageT=0;

/* ---------- inventory ---------- */
const bag={berries:0,water:0,wood:0,seeds:0};
const carried=()=>bag.berries+bag.water+bag.wood+bag.seeds;
const bagFull=()=>carried()>=TUNING.carryMax;

/* ---------- floating text + particles ---------- */
const pops=[], bits=[];
function pop(x,y,text,col){pops.push({x,y,text,col,t:0});}
function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=rnd()*Math.PI*2, s=18+rnd()*42;
    bits.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-18,t:0,col});
  }
}

/* ---------- input ---------- */
const input={moveX:0,moveY:0,aim:0,aimExplicit:false,act:false};
const keys=new Set();
let actHeld=0, actWasDown=false;
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
  if(e.key==='`') debugOn=!debugOn;
  if(e.key.toLowerCase()==='b'){ document.body.classList.contains('building')?closeBuild():openBuild(); }
  if(e.key==='Escape') closeBuild();
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());
let mouseWorld=null;
canvas.addEventListener('mousemove',e=>{mouseWorld={x:(e.clientX-viewLeft)/viewScale+cam.x,y:(e.clientY-viewTop)/viewScale+cam.y};});
canvas.addEventListener('mouseleave',()=>mouseWorld=null);

function readKeyboard(){
  let x=0,y=0;
  if(keys.has('a')||keys.has('arrowleft'))x-=1;
  if(keys.has('d')||keys.has('arrowright'))x+=1;
  if(keys.has('w')||keys.has('arrowup'))y-=1;
  if(keys.has('s')||keys.has('arrowdown'))y+=1;
  const m=Math.hypot(x,y); if(m>0){x/=m;y/=m;}
  input.moveX=x; input.moveY=y;
  if(keys.has('e')) input.act=true;
  if(mouseWorld){input.aim=Math.atan2(mouseWorld.y-player.y,mouseWorld.x-player.x);input.aimExplicit=true;}
}

const sticks={
  move:{id:null,ox:0,oy:0,dx:0,dy:0,el:document.getElementById('stickMove'),nub:document.getElementById('nubMove')},
  aim :{id:null,ox:0,oy:0,dx:0,dy:0,el:document.getElementById('stickAim'), nub:document.getElementById('nubAim')},
};
const STICK_MAX=46;
let actTouchId=null;
const actBtn=document.getElementById('actBtn');
function moveNub(s){s.nub.style.transform=`translate(${s.dx}px,${s.dy}px)`;}
function release(s){s.id=null;s.dx=0;s.dy=0;s.el.classList.remove('on');moveNub(s);}
// anything inside these should behave like a normal button, not a game control
const UI_SEL='#buildBtn,#buildPanel,#over,#rotate,#fsBtn,#fsTip';
function onUI(t){ return !!(t.target&&t.target.closest&&t.target.closest(UI_SEL)); }

addEventListener('touchstart',e=>{
  let gameTouch=false;
  for(const t of e.changedTouches){
    if(onUI(t)) continue;                       // let the tap become a real click
    if(t.target&&t.target.closest&&t.target.closest('#actBtn')){actTouchId=t.identifier;gameTouch=true;continue;}
    if(t.target&&t.target.closest&&t.target.closest('.slot')){
      useItem(t.target.closest('.slot').dataset.item); gameTouch=true; continue;
    }
    const s=t.clientX<innerWidth/2?sticks.move:sticks.aim;
    if(s.id!==null) continue;
    s.id=t.identifier;s.ox=t.clientX;s.oy=t.clientY;s.dx=0;s.dy=0;
    s.el.style.left=s.ox+'px';s.el.style.top=s.oy+'px';s.el.classList.add('on');moveNub(s);
    gameTouch=true;
  }
  if(gameTouch) e.preventDefault();
},{passive:false});
addEventListener('touchmove',e=>{
  let gameTouch=false;
  for(const t of e.changedTouches){
    if(onUI(t)) continue;
    gameTouch=true;
    if(t.identifier===actTouchId) continue;
    for(const k in sticks){
      const s=sticks[k]; if(s.id!==t.identifier) continue;
      let dx=t.clientX-s.ox,dy=t.clientY-s.oy;
      const d=Math.hypot(dx,dy);
      if(d>STICK_MAX){dx=dx/d*STICK_MAX;dy=dy/d*STICK_MAX;}
      s.dx=dx;s.dy=dy;moveNub(s);
    }
  }
  if(gameTouch) e.preventDefault();
},{passive:false});
function endT(e){
  let gameTouch=false;
  for(const t of e.changedTouches){
    if(onUI(t)) continue;                       // don't swallow the click
    gameTouch=true;
    if(t.identifier===actTouchId){actTouchId=null;continue;}
    for(const k in sticks) if(sticks[k].id===t.identifier) release(sticks[k]);
  }
  if(gameTouch) e.preventDefault();
}
addEventListener('touchend',endT,{passive:false});
addEventListener('touchcancel',endT,{passive:false});

function readTouch(){
  const m=sticks.move;
  if(m.id!==null){
    const d=Math.hypot(m.dx,m.dy),dead=8;
    if(d>dead){const n=Math.min(1,(d-dead)/(STICK_MAX-dead));input.moveX=m.dx/d*n;input.moveY=m.dy/d*n;}
  }
  const a=sticks.aim;
  if(a.id!==null&&Math.hypot(a.dx,a.dy)>10){input.aim=Math.atan2(a.dy,a.dx);input.aimExplicit=true;}
  if(actTouchId!==null) input.act=true;
}

/* ---------- player ---------- */
const player={x:spawnX,y:spawnY,vx:0,vy:0,facing:-Math.PI/2,bob:0,
  hunger:100, thirst:100, health:100, alive:true, lived:0};

function updateNeeds(dt){
  if(!player.alive) return;
  player.lived+=dt;
  player.hunger=Math.max(0,player.hunger-TUNING.hungerDrain*dt);
  player.thirst=Math.max(0,player.thirst-TUNING.thirstDrain*dt);
  if(player.hunger<=0||player.thirst<=0){
    player.health-=TUNING.hurtRate*dt;
  } else if(player.hunger>TUNING.healAbove&&player.thirst>TUNING.healAbove){
    player.health=Math.min(100,player.health+TUNING.healRate*dt);
  }
  if(player.health<=0){
    player.health=0; player.alive=false;
    const mins=Math.floor(player.lived/60), secs=Math.floor(player.lived%60);
    const why = player.hunger<=0 ? 'You ran out of food.' : 'You ran out of water.';
    document.getElementById('overText').textContent =
      why+' You lasted '+(mins?mins+' min ':'')+secs+' sec'+
      (pet&&pet.alive?', and '+pet.name+' was with you.':'.');
    document.body.classList.add('over');
  }
}

/* ---------- using things from your bag ---------- */

function collide(){
  for(const t of treesNear(player.x,player.y,44)){
    if(!t.alive) continue;
    const dx=player.x-t.x,dy=player.y-t.y,min=t.trunk+TUNING.playerRadius,d=Math.hypot(dx,dy);
    if(d<min&&d>.001){
      const p=min-d; player.x+=dx/d*p; player.y+=dy/d*p;
      const nx=dx/d,ny=dy/d,dot=player.vx*nx+player.vy*ny;
      if(dot<0){player.vx-=nx*dot;player.vy-=ny*dot;}
    }
  }
}
function updatePlayer(dt){
  player.vx+=input.moveX*TUNING.accel*dt; player.vy+=input.moveY*TUNING.accel*dt;
  let sp=Math.hypot(player.vx,player.vy);
  if(sp>0){
    const drop=TUNING.friction*dt*((input.moveX||input.moveY)?.35:1);
    const ns=Math.max(0,sp-drop); player.vx=player.vx/sp*ns; player.vy=player.vy/sp*ns;
  }
  sp=Math.hypot(player.vx,player.vy);
  if(sp>TUNING.maxSpeed){player.vx=player.vx/sp*TUNING.maxSpeed;player.vy=player.vy/sp*TUNING.maxSpeed;}
  player.x+=player.vx*dt; player.y+=player.vy*dt;
  player.x=Math.max(10,Math.min(worldW-10,player.x));
  player.y=Math.max(10,Math.min(worldH-10,player.y));
  collide();
  if(!input.aimExplicit&&sp>6){
    const want=Math.atan2(player.vy,player.vx);
    let d=want-player.facing;
    while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    player.facing+=d*Math.min(1,dt*10);
  } else if(input.aimExplicit) player.facing=input.aim;
  if(sp>6) player.bob+=dt*9;
}

/* ---------- interaction ---------- */
let target=null;      // {kind:'bush'|'tree'|'water', ref}
let holdT=0;

function findTarget(){
  let best=null, bestD=TUNING.reach;
  for(const b of bushes){
    if(!b.alive) continue;
    const d=Math.hypot(b.x-player.x,b.y-player.y);
    if(d<bestD){bestD=d;best={kind:'bush',ref:b};}
  }
  for(const t of treesNear(player.x,player.y,TUNING.reach+20)){
    if(!t.alive) continue;
    const d=Math.hypot(t.x-player.x,t.y-player.y)-t.trunk;
    if(d<bestD){bestD=d;best={kind:'tree',ref:t};}
  }
  for(const p of plotSlots){
    const d=Math.hypot(p.x-player.x,p.y-player.y);
    if(d<bestD){bestD=d;best={kind:'plot',ref:p};}
  }
  for(const a of animals){
    if(a.tame) continue;
    const d=Math.hypot(a.x-player.x,a.y-player.y);
    if(d<bestD){bestD=d;best={kind:'animal',ref:a};}
  }
  if(!best){
    const fx=player.x+Math.cos(player.facing)*12, fy=player.y+Math.sin(player.facing)*12;
    if(isWaterAt(fx,fy)||isWaterAt(player.x,player.y)) best={kind:'water',ref:null};
  }
  return best;
}

function doTap(t){
  if(!t) return;
  if(bagFull()){pop(player.x,player.y-14,'bag full','#e0b070');return;}
  if(t.kind==='bush'){
    bag.berries+=t.ref.yield;
    pop(t.ref.x,t.ref.y-12,'+'+t.ref.yield+' berries','#e2718f');
    burst(t.ref.x,t.ref.y,'#c2506e',10);
    t.ref.alive=false;                   // gone for good
  } else if(t.kind==='water'){
    bag.water+=2;
    pop(player.x,player.y-14,'+2 water','#8fc6e0');
    burst(player.x,player.y,'#7fb8dc',8);
  } else if(t.kind==='tree'){
    pop(t.ref.x,t.ref.y-t.ref.canopy,'hold to chop','#cbbf9a');
  } else if(t.kind==='plot'){
    const p=t.ref;
    if(p.state==='ready'){
      bag.berries+=TUNING.cropYield;
      pop(p.x,p.y-12,'+'+TUNING.cropYield+' berries','#e2718f');
      burst(p.x,p.y,'#c2506e',12);
      p.state='empty'; p.t=0;
    } else if(p.state==='growing'){
      pop(p.x,p.y-12,'still growing','#a8c07a');
    } else {
      if(bag.seeds<=0){ pop(p.x,p.y-12,'you need a seed','#e0b070'); return; }
      if(bag.water<=0){ pop(p.x,p.y-12,'you need water','#e0b070'); return; }
      bag.seeds--; bag.water--;
      p.state='growing'; p.t=0;
      pop(p.x,p.y-12,'planted','#a8c07a');
      burst(p.x,p.y,'#6d8a4a',8);
    }
  } else if(t.kind==='animal'){
    const a=t.ref;
    if(pet){ pop(a.x,a.y-14,'you already have '+pet.name,'#e0b070'); return; }
    if(bag.berries<=0){ pop(a.x,a.y-14,'you need berries','#e0b070'); return; }
    bag.berries--; a.fed++;
    burst(a.x,a.y,'#c2506e',6);
    if(a.fed>=a.sp.cost){
      a.tame=true;
      pet={x:a.x,y:a.y,vx:0,vy:0,sp:a.sp,name:a.name,hunger:100,bob:a.bob,
           find:null,findT:0,alive:true,down:0};
      petMessage=a.name+' is your friend now'; petMessageT=0;
      pop(a.x,a.y-16,'♥ '+a.name,'#f0a0b8');
      burst(a.x,a.y,'#f0a0b8',20);
    } else {
      pop(a.x,a.y-14,a.fed+' / '+a.sp.cost,'#e2718f');
    }
  }
}
function finishHold(t){
  if(t.kind==='tree'){
    bag.wood+=TUNING.woodPerTree; bag.seeds+=TUNING.seedsPerTree;
    pop(t.ref.x,t.ref.y-12,'+'+TUNING.woodPerTree+' wood  +'+TUNING.seedsPerTree+' seeds','#cbbf9a');
    burst(t.ref.x,t.ref.y,'#6b5a3e',18);
    t.ref.alive=false;
    stumps.push({x:t.ref.x,y:t.ref.y,r:t.ref.trunk,tone:t.ref.tone});
  } else if(t.kind==='bush'){
    bag.seeds+=TUNING.seedsPerBush;
    pop(t.ref.x,t.ref.y-12,'+'+TUNING.seedsPerBush+' seed','#a8c07a');
    burst(t.ref.x,t.ref.y,'#6d8a4a',10);
    t.ref.alive=false;
  }
}
function updateInteraction(dt){
  target=findTarget();
  const holdable = target && (target.kind==='tree'||target.kind==='bush');
  const need = target ? (target.kind==='tree'?TUNING.chopTime:TUNING.digTime) : 1;

  if(input.act && target){
    if(holdable){
      holdT+=dt;
      if(holdT>=need){ finishHold(target); holdT=0; actWasDown=false; return; }
    }
  } else {
    // released: short press counts as a tap
    if(actWasDown && holdT<0.28 && target) doTap(target);
    holdT=0;
  }
  actWasDown = input.act && !!target;
  if(!input.act) actWasDown=false;
}

/* ---------- your camps ----------
   You can build as many houses as you like. Each one is its own little camp,
   and the fire, garden and storage box belong to whichever house is nearest. */
const camps=[];
const plotSlots=[];
let flicker=0;

const BUILDS=[
  {id:'shelter',name:'House',       cost:()=>TUNING.costShelter, col:'#8a6a44',
   desc:'A new camp. Build as many as you want, all over the forest.',
   has:c=>false},
  {id:'fire',   name:'Campfire',    cost:()=>TUNING.costFire,    col:'#e08a42',
   desc:'Lights up this camp so you can spot it from far away.',
   has:c=>!!c&&c.fire},
  {id:'plot',   name:'Garden',      cost:()=>TUNING.costPlot,    col:'#6d8a4a',
   desc:'Plant a seed and some water here, and berries grow.',
   has:c=>!!c&&c.plot},
  {id:'storage',name:'Storage box', cost:()=>TUNING.costStorage, col:'#a8926a',
   desc:'Carry '+TUNING.storageBonus+' more things. Every box adds more.',
   has:c=>!!c&&c.storage},
];

function spotIsClear(x,y){
  if(isWaterAt(x,y)) return false;
  for(const t of treesNear(x,y,40)) if(t.alive&&Math.hypot(t.x-x,t.y-y)<t.trunk+14) return false;
  return true;
}
function nearestCamp(){
  let best=null,bd=TUNING.campRange;
  for(const c of camps){
    const d=Math.hypot(player.x-c.x,player.y-c.y);
    if(d<bd){bd=d;best=c;}
  }
  return best;
}
function flashMsg(t){ petMessage=t; petMessageT=0; }

function tryBuild(id){
  const b=BUILDS.find(v=>v.id===id);
  if(!b) return;
  if(bag.wood<b.cost()){ flashMsg('You need '+b.cost()+' wood'); return; }

  if(id==='shelter'){
    if(!spotIsClear(player.x,player.y)){ flashMsg('Not enough space here'); return; }
    for(const c of camps){
      if(Math.hypot(player.x-c.x,player.y-c.y)<TUNING.campSpacing){
        flashMsg('Too close to another house'); return;
      }
    }
    camps.push({x:player.x,y:player.y,fire:false,plot:false,storage:false});
    bag.wood-=b.cost();
    burst(player.x,player.y,b.col,16);
    flashMsg(camps.length===1?'House built!':'Camp '+camps.length+' built!');
    renderBuildList();
    return;
  }

  const c=nearestCamp();
  if(!c){ flashMsg(camps.length?'Go to one of your camps':'Build a house first'); return; }
  if(b.has(c)){ flashMsg('This camp already has one'); return; }

  if(id==='fire') c.fire=true;
  if(id==='storage'){ c.storage=true; TUNING.carryMax+=TUNING.storageBonus; }
  if(id==='plot'){
    c.plot=true;
    for(let i=0;i<4;i++){
      plotSlots.push({x:c.x+((i%2)*17-8.5)+22, y:c.y+(Math.floor(i/2)*17-8.5)+8,
                      state:'empty', t:0});
    }
  }
  bag.wood-=b.cost();
  burst(player.x,player.y,b.col,16);
  flashMsg(b.name+' built!');
  renderBuildList();
}

function updatePlots(dt){
  for(const p of plotSlots){
    if(p.state==='growing'){
      p.t+=dt;
      if(p.t>=TUNING.growTime){ p.state='ready'; p.t=0; }
    }
  }
  flicker+=dt;
}

/* ---------- build menu ---------- */
const buildList=document.getElementById('buildList');

function renderBuildList(){
  const c=nearestCamp();
  buildWood.textContent='You have '+bag.wood+' wood'+
    (camps.length? ' · '+camps.length+' camp'+(camps.length>1?'s':'')+
      (c?' · you are at camp '+(camps.indexOf(c)+1):' · not at a camp') : '');
  buildList.innerHTML='';
  for(const b of BUILDS){

    el.className='bItem'+(done?' done':((can&&!blocked)?'':' no'));
    let costText = done ? 'built here' : (blocked ? 'go to a camp' : b.cost()+' wood');
    el.innerHTML='<span class="bIcon" style="background:'+b.col+'"></span>'+
      '<span><span class="bName">'+b.name+'</span><div class="bDesc">'+b.desc+'</div></span>'+
      '<span class="bCost">'+costText+'</span>';
    if(!done&&!blocked) el.addEventListener('click',()=>{tryBuild(b.id);});
    buildList.appendChild(el);

/* ---------- wild animals wander ---------- */
function updateAnimals(dt){
  for(const p of plotSlots){
    const d=Math.hypot(p.x-player.x,p.y-player.y);
    if(d<bestD){bestD=d;best={kind:'plot',ref:p};}
  }
  for(const a of animals){
    if(a.tame) continue;
    a.wanderT-=dt;
    if(a.wanderT<=0){ a.wander=Math.random()*Math.PI*2; a.wanderT=1.2+Math.random()*2.4; }
    const near=Math.hypot(a.x-player.x,a.y-player.y);
    let sx=Math.cos(a.wander)*22, sy=Math.sin(a.wander)*22;
    if(near<40 && a.fed===0){            // shy until you've offered something
      sx=(a.x-player.x)/near*30; sy=(a.y-player.y)/near*30;
    }
    a.vx+=(sx-a.vx)*dt*3; a.vy+=(sy-a.vy)*dt*3;
    const nx=a.x+a.vx*dt, ny=a.y+a.vy*dt;
    let blocked=false;
    for(const t of treesNear(nx,ny,26)){
      if(t.alive && Math.hypot(nx-t.x,ny-t.y)<t.trunk+a.sp.body*.6){blocked=true;break;}
    }
    if(!blocked && nx>8 && ny>8 && nx<worldW-8 && ny<worldH-8){a.x=nx;a.y=ny;}
    else a.wander=Math.random()*Math.PI*2;
    a.bob+=dt*(Math.hypot(a.vx,a.vy)>4?7:1.5);
  }
}

/* ---------- your pet ---------- */
function nearestFind(){
  let best=null,bd=pet.sp.sniff;
  for(const b of bushes){
    if(!b.alive) continue;
    const d=Math.hypot(b.x-pet.x,b.y-pet.y);
    // only worth pointing out things you can't already see
    if(d<bd && Math.hypot(b.x-player.x,b.y-player.y)>TUNING.coneRange*.6){bd=d;best=b;}
  }
  return best;
}
function updatePet(dt){
  if(!pet||!pet.alive) return;
  pet.hunger-=TUNING.petHungerDrain*dt;

  // eats from your bag when it can
  if(pet.hunger<TUNING.hungryBelow && bag.berries>0){
    bag.berries--; pet.hunger=Math.min(100,pet.hunger+TUNING.petEatAmount);
    pop(pet.x,pet.y-12,pet.name+' ate a berry','#e2718f');
  }
  if(pet.hunger<=0){
    pet.alive=false;
    petGrave={x:pet.x,y:pet.y,name:pet.name};
    petMessage=pet.name+' was too hungry. Find a new friend.'; petMessageT=0;
    burst(pet.x,pet.y,'#7a8a72',22);
    return;
  }

  const starving=pet.hunger<TUNING.starvingBelow;
  const hungry=pet.hunger<TUNING.hungryBelow;

  if(starving){ pet.down=Math.min(1,pet.down+dt*2); pet.find=null; return; }
  pet.down=Math.max(0,pet.down-dt*2);

  // healthy pets go looking for things
  pet.findT-=dt;
  if(!hungry){
    if(pet.findT<=0||!pet.find||!pet.find.alive){ pet.find=nearestFind(); pet.findT=2.5; }
  } else pet.find=null;

  const distToYou=Math.hypot(player.x-pet.x,player.y-pet.y);
  let tx=player.x, ty=player.y, urgency=1;
  if(pet.find && distToYou<190){ tx=pet.find.x; ty=pet.find.y; urgency=.9; }

  const dx=tx-pet.x, dy=ty-pet.y, d=Math.hypot(dx,dy);
  const stop = (tx===player.x&&ty===player.y) ? TUNING.petFollowDist : 12;
  if(d>stop){
    const sp=TUNING.petSpeed*(hungry?.62:1)*urgency;
    pet.vx+=((dx/d)*sp-pet.vx)*dt*5;
    pet.vy+=((dy/d)*sp-pet.vy)*dt*5;
  } else { pet.vx*=.86; pet.vy*=.86; }

  const nx=pet.x+pet.vx*dt, ny=pet.y+pet.vy*dt;
  let blocked=false;
  for(const t of treesNear(nx,ny,26)){
    if(t.alive && Math.hypot(nx-t.x,ny-t.y)<t.trunk+pet.sp.body*.6){blocked=true;break;}
  }
  if(!blocked){pet.x=Math.max(8,Math.min(worldW-8,nx));pet.y=Math.max(8,Math.min(worldH-8,ny));}
  else { pet.vx=-pet.vy*.6; pet.vy=pet.vx*.6; }
  pet.bob+=dt*(Math.hypot(pet.vx,pet.vy)>6?8:2);
}

/* ---------- camera ---------- */
const cam={x:player.x-TUNING.viewW/2,y:player.y-TUNING.viewH/2};
function updateCamera(dt){
  const tx=player.x-TUNING.viewW/2, ty=player.y-TUNING.viewH/2;
  const k=1-Math.exp(-TUNING.camLerp*dt);
  cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k;
  cam.x=Math.max(0,Math.min(worldW-TUNING.viewW,cam.x));
  cam.y=Math.max(0,Math.min(worldH-TUNING.viewH,cam.y));
}

/* ---------- drawing ---------- */
function drawFloor(){
  const x0=Math.floor(cam.x/T),y0=Math.floor(cam.y/T);
  const x1=Math.ceil((cam.x+TUNING.viewW)/T),y1=Math.ceil((cam.y+TUNING.viewH)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    if(tx<0||ty<0||tx>=W||ty>=H){ctx.fillStyle='#060b08';}
    else if(water[ty*W+tx]){
      const s=vnoise(tx*.3+clock*.35,ty*.3);
      ctx.fillStyle=`rgb(${28+s*10|0},${58+s*22|0},${72+s*26|0})`;
    } else {
      const n=floorTone[ty*W+tx], damp=vnoise(tx*.09,ty*.09);
      ctx.fillStyle=`rgb(${30+n*10+damp*8|0},${40+n*14+damp*14|0},${26+n*8+damp*6|0})`;
    }
    ctx.fillRect(Math.round(tx*T-cam.x),Math.round(ty*T-cam.y),T,T);
  }
  for(const f of ferns){
    const sx=f.x-cam.x,sy=f.y-cam.y;
    if(sx<-12||sy<-12||sx>TUNING.viewW+12||sy>TUNING.viewH+12) continue;
    ctx.fillStyle=f.t>.55?'rgba(86,112,64,.55)':'rgba(62,86,50,.5)';
    ctx.beginPath(); ctx.ellipse(sx|0,sy|0,f.r,f.r*.62,f.t*3,0,Math.PI*2); ctx.fill();
  }
  // stumps stay forever — your landmarks
  for(const s of stumps){
    const sx=s.x-cam.x,sy=s.y-cam.y;
    if(sx<-20||sy<-20||sx>TUNING.viewW+20||sy>TUNING.viewH+20) continue;
    ctx.fillStyle='#3a2f22';
    ctx.beginPath(); ctx.ellipse(sx,sy,s.r+1.6,(s.r+1.6)*.8,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#6a5636';
    ctx.beginPath(); ctx.ellipse(sx,sy-1,s.r,s.r*.78,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(40,32,20,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.ellipse(sx,sy-1,s.r*.55,s.r*.42,0,0,Math.PI*2); ctx.stroke();
  }
}

function drawBushes(){
  for(const b of bushes){
    if(!b.alive) continue;
    const sx=b.x-cam.x,sy=b.y-cam.y;
    if(sx<-20||sy<-20||sx>TUNING.viewW+20||sy>TUNING.viewH+20) continue;
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.ellipse(sx,sy+2,b.r*.9,b.r*.4,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=`rgb(${44+b.tone*14|0},${74+b.tone*18|0},${42+b.tone*10|0})`;
    ctx.beginPath(); ctx.ellipse(sx,sy-1,b.r,b.r*.82,0,0,Math.PI*2); ctx.fill();
    for(let i=0;i<3;i++){
      const a=b.tone*6+i*2.1;
      ctx.fillStyle='#c2506e';
      ctx.beginPath();
      ctx.arc(sx+Math.cos(a)*b.r*.45, sy-1+Math.sin(a)*b.r*.42, 1.5, 0, Math.PI*2);
      ctx.fill();
    }
  }
}

function drawTrees(){
  const list=treesNear(cam.x+TUNING.viewW/2,cam.y+TUNING.viewH/2,460).filter(t=>t.alive);
  list.sort((a,b)=>a.y-b.y);
  for(const t of list){
    const sx=t.x-cam.x,sy=t.y-cam.y;
    if(sx<-40||sy<-40||sx>TUNING.viewW+40||sy>TUNING.viewH+40) continue;
    ctx.fillStyle='#241d16';
    ctx.beginPath(); ctx.ellipse(sx,sy,t.trunk+1.4,t.trunk*.78,0,0,Math.PI*2); ctx.fill();
    const c=t.tone;
    ctx.fillStyle=`rgb(${24+c*14|0},${42+c*22|0},${26+c*12|0})`;
    ctx.beginPath(); ctx.ellipse(sx+t.lean,sy-t.canopy*.22,t.canopy,t.canopy*.88,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(150,186,116,.10)';
    ctx.beginPath(); ctx.ellipse(sx+t.lean-t.canopy*.22,sy-t.canopy*.5,t.canopy*.52,t.canopy*.4,0,0,Math.PI*2); ctx.fill();
  }
}

function drawHighlight(){
  if(!target) return;
  let hx,hy,hr;
  if(target.kind==='water'){hx=player.x;hy=player.y;hr=13;}
  else if(target.kind==='animal'){hx=target.ref.x;hy=target.ref.y;hr=target.ref.sp.body+6;}
  else if(target.kind==='plot'){hx=target.ref.x;hy=target.ref.y;hr=10;}
  else {hx=target.ref.x;hy=target.ref.y;hr=(target.kind==='tree'?target.ref.trunk+7:target.ref.r+5);}
  const sx=hx-cam.x, sy=hy-cam.y;
  ctx.save();
  ctx.strokeStyle='rgba(240,200,140,.75)'; ctx.lineWidth=1.4;
  ctx.setLineDash([3,3]); ctx.lineDashOffset=-clock*14;
  ctx.beginPath(); ctx.ellipse(sx,sy,hr,hr*.8,0,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  const need=target.kind==='tree'?TUNING.chopTime:TUNING.digTime;
  if(holdT>0){
    ctx.strokeStyle='#f0c88c'; ctx.lineWidth=2.4;
    ctx.beginPath();
    ctx.ellipse(sx,sy,hr,hr*.8,0,-Math.PI/2,-Math.PI/2+Math.PI*2*Math.min(1,holdT/need));
    ctx.stroke();
  }
  ctx.restore();
}

function drawCamp(){
  // gardens
  for(const p of plotSlots){
    const sx=Math.round(p.x-cam.x), sy=Math.round(p.y-cam.y);
    if(sx<-20||sy<-20||sx>TUNING.viewW+20||sy>TUNING.viewH+20) continue;
    ctx.fillStyle='#4a3a26';
    ctx.fillRect(sx-7,sy-6,14,12);
    ctx.strokeStyle='rgba(30,24,14,.6)'; ctx.lineWidth=1;
    ctx.strokeRect(sx-7.5,sy-6.5,15,13);
    if(p.state==='growing'){
      const g=Math.min(1,p.t/TUNING.growTime);
      ctx.strokeStyle='#7ba455'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(sx,sy+4); ctx.lineTo(sx,sy+4-7*g); ctx.stroke();
      if(g>.45){
        ctx.fillStyle='#7ba455';
        ctx.beginPath(); ctx.ellipse(sx-2.5,sy+4-6*g,2.4,1.4,-.5,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(sx+2.5,sy+3-6*g,2.4,1.4,.5,0,Math.PI*2); ctx.fill();
      }
    } else if(p.state==='ready'){
      ctx.fillStyle='#5f8a44';
      ctx.beginPath(); ctx.ellipse(sx,sy-1,6,5,0,0,Math.PI*2); ctx.fill();
      for(let i=0;i<3;i++){
        ctx.fillStyle='#c2506e';
        ctx.beginPath(); ctx.arc(sx+Math.cos(i*2.1)*3, sy-1+Math.sin(i*2.1)*2.6, 1.6,0,Math.PI*2); ctx.fill();
      }
    }
  }

  const here=nearestCamp();
  for(const c of camps){
    const sx=Math.round(c.x-cam.x), sy=Math.round(c.y-cam.y);
    if(sx<-70||sy<-70||sx>TUNING.viewW+70||sy>TUNING.viewH+70) continue;

    if(c.storage){
      ctx.fillStyle='#3a2f22'; ctx.fillRect(sx-32,sy+4,14,11);
      ctx.fillStyle='#a8926a'; ctx.fillRect(sx-31,sy+3,12,10);
      ctx.strokeStyle='rgba(50,40,24,.6)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(sx-31,sy+7.5); ctx.lineTo(sx-19,sy+7.5); ctx.stroke();
    }
    if(c.fire){
      const fx=sx+2, fy=sy+26;
      ctx.fillStyle='#3a2f22';
      for(let i=0;i<3;i++){
        ctx.save(); ctx.translate(fx,fy); ctx.rotate(i*1.05);
        ctx.fillRect(-6,-1.2,12,2.4); ctx.restore();
      }
      const f=.7+.3*Math.sin(flicker*9+c.x)+.15*Math.sin(flicker*21+c.y);
      ctx.fillStyle='#e0682a';
      ctx.beginPath(); ctx.ellipse(fx,fy-4,4.2*f,6.4*f,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#f5c25a';
      ctx.beginPath(); ctx.ellipse(fx,fy-4.5,2.2*f,3.6*f,0,0,Math.PI*2); ctx.fill();
    }
    // the house
    ctx.fillStyle='rgba(0,0,0,.34)';
    ctx.beginPath(); ctx.ellipse(sx,sy+8,20,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#5c4630';
    ctx.fillRect(sx-17,sy-8,34,17);
    ctx.fillStyle='#7a5c3c';
    ctx.beginPath();
    ctx.moveTo(sx-21,sy-7); ctx.lineTo(sx,sy-20); ctx.lineTo(sx+21,sy-7);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(40,30,18,.55)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(sx,sy-20); ctx.lineTo(sx,sy-7); ctx.stroke();
    ctx.fillStyle='#2e2318';
    ctx.fillRect(sx-5,sy-3,10,12);
    ctx.fillStyle='rgba(240,200,140,.35)';
    ctx.fillRect(sx-4,sy-2,8,10);
    // camp number, so you can tell them apart
    ctx.font='7px ui-monospace, Menlo, monospace';
    ctx.textAlign='center';
    ctx.fillStyle = c===here ? 'rgba(240,200,140,.95)' : 'rgba(200,214,190,.45)';
    ctx.fillText(String(camps.indexOf(c)+1), sx, sy-30);
    ctx.textAlign='left';
  }
}

function drawCreature(cx,cy,sp,bobv,downAmt,fedInfo){
  const sx=Math.round(cx-cam.x), sy=Math.round(cy-cam.y);
  if(sx<-30||sy<-30||sx>TUNING.viewW+30||sy>TUNING.viewH+30) return;
  const wob=Math.sin(bobv)*.9*(1-downAmt);
  const flat=1-downAmt*.55;
  ctx.fillStyle='rgba(0,0,0,.32)';
  ctx.beginPath(); ctx.ellipse(sx,sy+3,sp.body*.9,sp.body*.4,0,0,Math.PI*2); ctx.fill();
  // body
  ctx.fillStyle=sp.col;
  ctx.beginPath();
  ctx.ellipse(sx,sy+wob,sp.body,sp.body*.72*flat,0,0,Math.PI*2);
  ctx.fill();
  // head
  ctx.beginPath();
  ctx.arc(sx+sp.body*.72,sy+wob-sp.body*.28*flat,sp.body*.46,0,Math.PI*2);
  ctx.fill();
  // ears
  ctx.fillStyle=sp.col;
  if(sp.ear==='long'){
    ctx.fillRect(sx+sp.body*.62,sy+wob-sp.body*1.28*flat,1.6,sp.body*.72*flat);
    ctx.fillRect(sx+sp.body*.94,sy+wob-sp.body*1.22*flat,1.6,sp.body*.66*flat);
  } else {
    ctx.beginPath();
    ctx.moveTo(sx+sp.body*.52,sy+wob-sp.body*.62*flat);
    ctx.lineTo(sx+sp.body*.72,sy+wob-sp.body*1.10*flat);
    ctx.lineTo(sx+sp.body*.92,sy+wob-sp.body*.58*flat);
    ctx.closePath(); ctx.fill();
  }
  // eye
  ctx.fillStyle='#2a2018';
  ctx.beginPath(); ctx.arc(sx+sp.body*.88,sy+wob-sp.body*.34*flat,.9,0,Math.PI*2); ctx.fill();
  // taming progress
  if(fedInfo && fedInfo.fed>0){
    ctx.font='7px ui-monospace, Menlo, monospace';
    ctx.textAlign='center';
    ctx.fillStyle='#e2718f';
    ctx.fillText(fedInfo.fed+'/'+fedInfo.cost, sx, sy-sp.body*2.1);
    ctx.textAlign='left';
  }
}

function drawAnimals(){
  for(const p of plotSlots){
    const d=Math.hypot(p.x-player.x,p.y-player.y);
    if(d<bestD){bestD=d;best={kind:'plot',ref:p};}
  }
  for(const a of animals){
    if(a.tame) continue;
    drawCreature(a.x,a.y,a.sp,a.bob,0,{fed:a.fed,cost:a.sp.cost});
  }
}
function drawPet(){
  if(pet&&pet.alive) drawCreature(pet.x,pet.y,pet.sp,pet.bob,pet.down,null);
  if(petGrave){
    const sx=Math.round(petGrave.x-cam.x),sy=Math.round(petGrave.y-cam.y);
    if(sx>-20&&sy>-20&&sx<TUNING.viewW+20&&sy<TUNING.viewH+20){
      ctx.strokeStyle='rgba(180,196,170,.5)'; ctx.lineWidth=1.4;
      ctx.beginPath(); ctx.moveTo(sx,sy-6); ctx.lineTo(sx,sy+3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx-3.5,sy-3); ctx.lineTo(sx+3.5,sy-3); ctx.stroke();
    }
  }
}

function drawPlayer(){
  const sx=Math.round(player.x-cam.x),sy=Math.round(player.y-cam.y),wob=Math.sin(player.bob)*.8;
  ctx.fillStyle='rgba(0,0,0,.36)';
  ctx.beginPath(); ctx.ellipse(sx,sy+4,6,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c9c2ae';
  ctx.beginPath(); ctx.arc(sx,sy+wob,TUNING.playerRadius,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f0c88c';
  ctx.beginPath(); ctx.arc(sx+Math.cos(player.facing)*2.4,sy+wob+Math.sin(player.facing)*2.4,2.1,0,Math.PI*2); ctx.fill();
}

function drawSight(){
  const px=player.x-cam.x,py=player.y-cam.y;
  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle=`rgba(8,16,12,${TUNING.gloom})`;
  dctx.fillRect(0,0,TUNING.viewW,TUNING.viewH);
  dctx.globalCompositeOperation='destination-out';
  const steps=TUNING.coneFeather;
  for(let i=0;i<steps;i++){
    const t=i/(steps-1);
    const half=TUNING.coneAngle*(1.45-.45*t), rng=TUNING.coneRange*(.70+.30*t);
    const g=dctx.createRadialGradient(px,py,4,px,py,rng), a=.17+t*.33;
    g.addColorStop(0,`rgba(0,0,0,${a})`);
    g.addColorStop(.55,`rgba(0,0,0,${a*.78})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g;
    dctx.beginPath(); dctx.moveTo(px,py);
    dctx.arc(px,py,rng,player.facing-half,player.facing+half);
    dctx.closePath(); dctx.fill();
  }
  for(const c of camps){
    if(!c.fire) continue;
    const fx=c.x-cam.x, fy=c.y+26-cam.y;
    if(fx<-TUNING.fireLight||fy<-TUNING.fireLight||
       fx>TUNING.viewW+TUNING.fireLight||fy>TUNING.viewH+TUNING.fireLight) continue;
    const gf=dctx.createRadialGradient(fx,fy,3,fx,fy,TUNING.fireLight);
    gf.addColorStop(0,'rgba(0,0,0,.95)');
    gf.addColorStop(.45,'rgba(0,0,0,.6)');
    gf.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=gf;
    dctx.beginPath(); dctx.arc(fx,fy,TUNING.fireLight,0,Math.PI*2); dctx.fill();
  }
  const ga=dctx.createRadialGradient(px,py,2,px,py,TUNING.ambientRadius);
  ga.addColorStop(0,'rgba(0,0,0,.90)'); ga.addColorStop(.5,'rgba(0,0,0,.52)'); ga.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=ga;
  dctx.beginPath(); dctx.arc(px,py,TUNING.ambientRadius,0,Math.PI*2); dctx.fill();

  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle=`rgba(8,16,12,${TUNING.gloom})`;
  const far=TUNING.coneRange*1.9;
  for(const t of treesNear(player.x,player.y,TUNING.coneRange+30)){
    if(!t.alive) continue;                        // chopped trees stop blocking sight
    const dx=t.x-player.x,dy=t.y-player.y,dist=Math.hypot(dx,dy);
    if(dist<=t.trunk||dist>TUNING.coneRange+30) continue;
    const a=Math.atan2(dy,dx), spread=Math.asin(Math.min(1,(t.trunk+TUNING.shadowSoft)/dist));
    const a1=a-spread,a2=a+spread,nd=dist*Math.cos(spread);
    dctx.beginPath();
    dctx.moveTo(px+Math.cos(a1)*nd,py+Math.sin(a1)*nd);
    dctx.lineTo(px+Math.cos(a1)*far,py+Math.sin(a1)*far);
    dctx.lineTo(px+Math.cos(a2)*far,py+Math.sin(a2)*far);
    dctx.lineTo(px+Math.cos(a2)*nd,py+Math.sin(a2)*nd);
    dctx.closePath(); dctx.fill();
  }
  ctx.drawImage(dark,0,0);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const gb=ctx.createRadialGradient(px,py,2,px,py,TUNING.coneRange*.55);
  gb.addColorStop(0,'rgba(240,200,140,.085)'); gb.addColorStop(1,'rgba(240,200,140,0)');
  ctx.fillStyle=gb;
  ctx.beginPath(); ctx.moveTo(px,py);
  ctx.arc(px,py,TUNING.coneRange*.55,player.facing-TUNING.coneAngle*1.1,player.facing+TUNING.coneAngle*1.1);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEffects(dt){
  for(let i=bits.length-1;i>=0;i--){
    const b=bits[i]; b.t+=dt;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.vy+=90*dt;
    if(b.t>.7){bits.splice(i,1);continue;}
    ctx.globalAlpha=1-b.t/.7; ctx.fillStyle=b.col;
    ctx.fillRect(Math.round(b.x-cam.x),Math.round(b.y-cam.y),2,2);
    ctx.globalAlpha=1;
  }
  ctx.font='8px ui-monospace, Menlo, monospace';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=pops.length-1;i>=0;i--){
    const p=pops[i]; p.t+=dt;
    if(p.t>1.3){pops.splice(i,1);continue;}
    ctx.globalAlpha=Math.min(1,(1.3-p.t)*1.6);
    ctx.fillStyle=p.col;
    ctx.fillText(p.text, Math.round(p.x-cam.x), Math.round(p.y-cam.y-p.t*16));
    ctx.globalAlpha=1;
  }
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
}

function drawHUD(){
  ctx.font='8px ui-monospace, Menlo, monospace'; ctx.textBaseline='top';
  const bars=[['health',player.health,'#d9635f'],['food',player.hunger,'#8fc07a'],['water',player.thirst,'#7fb8dc']];
  ctx.fillStyle='rgba(8,16,12,.6)'; ctx.fillRect(6,6,88,bars.length*13+8);
  let by=11;
  for(const [label,val,col] of bars){
    ctx.fillStyle='rgba(200,214,190,.65)'; ctx.fillText(label,11,by);
    ctx.fillStyle='rgba(255,255,255,.13)'; ctx.fillRect(44,by+1,44,5);
    ctx.fillStyle = val<25 ? '#d9635f' : col;
    ctx.fillRect(44,by+1,44*Math.max(0,val)/100,5);
    by+=13;
  }
  if(bagFull()){ ctx.fillStyle='#e0b070'; ctx.fillText('bag full', 10, by+2); }
  // pet status
  if(pet&&pet.alive){
    const w=54, h=5, bx=TUNING.viewW-w-10, by=10;
    ctx.fillStyle='rgba(8,16,12,.6)'; ctx.fillRect(bx-4,by-2,w+8,h+16);
    ctx.fillStyle='rgba(200,214,190,.85)';
    ctx.textAlign='right';
    ctx.fillText(pet.name, TUNING.viewW-10, by);
    ctx.textAlign='left';
    ctx.fillStyle='rgba(255,255,255,.15)'; ctx.fillRect(bx,by+10,w,h);
    const p=Math.max(0,pet.hunger)/100;
    ctx.fillStyle = pet.hunger<TUNING.starvingBelow ? '#d05a5a'
                  : pet.hunger<TUNING.hungryBelow ? '#e0b070' : '#8fc07a';
    ctx.fillRect(bx,by+10,w*p,h);
  } else if(!pet){
    ctx.fillStyle='rgba(200,214,190,.55)';
    ctx.textAlign='right';
    ctx.fillText('no friend yet', TUNING.viewW-10, 10);
    ctx.textAlign='left';
  }
  // big message
  if(petMessage){
    ctx.font='9px ui-monospace, Menlo, monospace';
    ctx.textAlign='center';
    ctx.globalAlpha=Math.min(1,Math.min(petMessageT*2,(4.5-petMessageT)*1.2));
    ctx.fillStyle='#f0d0a8';
    ctx.fillText(petMessage, TUNING.viewW/2, TUNING.viewH-40);
    ctx.globalAlpha=1; ctx.textAlign='left';
  }
}

/* the pet points out things you can't see */
function drawPetFind(){
  if(!pet||!pet.alive||!pet.find||!pet.find.alive) return;
  const sx=pet.find.x-cam.x, sy=pet.find.y-cam.y;
  if(sx<-10||sy<-10||sx>TUNING.viewW+10||sy>TUNING.viewH+10) return;
  const pulse=.5+.5*Math.sin(clock*4);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.strokeStyle=`rgba(226,150,175,${.35+pulse*.4})`;
  ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.ellipse(sx,sy,7+pulse*3,(7+pulse*3)*.8,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

/* ---------- action button label ---------- */
const actLabel=document.getElementById('actLabel');
const ringPath=document.getElementById('ringPath');
const RING_LEN=2*Math.PI*45;
ringPath.style.strokeDasharray=RING_LEN;
function syncButton(){
  if(!isTouch) return;
  if(target){
    actBtn.classList.add('show');
    actLabel.textContent = target.kind==='tree' ? 'hold to chop'
                        : target.kind==='water' ? 'drink'
                        : target.kind==='animal' ? 'feed'
                        : target.kind==='plot' ? (target.ref.state==='ready'?'harvest':target.ref.state==='growing'?'growing':'plant')
                        : 'pick';
    const need=target.kind==='tree'?TUNING.chopTime:TUNING.digTime;
    const p=Math.min(1,holdT/need);
    ringPath.style.strokeDashoffset=RING_LEN*(1-p);
  } else {
    actBtn.classList.remove('show');
    ringPath.style.strokeDashoffset=RING_LEN;
  }
}
const hintKey=document.getElementById('hintKey');
function syncHint(){
  if(!target){ hintKey.textContent = isTouch?'find berries, water, trees':'E to pick · hold E to chop'; return; }
  if(target.kind==='plot'){
    const p=target.ref;
    hintKey.textContent = p.state==='ready' ? 'ready! pick your berries'
      : p.state==='growing' ? 'growing…'
      : 'plant a seed (needs 1 seed + 1 water)';
    return;
  }
  if(target.kind==='animal'){
    const a=target.ref;
    hintKey.textContent = pet ? 'you already have '+pet.name
      : 'feed the '+a.sp.name+' — '+a.fed+' / '+a.sp.cost+' berries';
    return;
  }
  hintKey.textContent = target.kind==='tree' ? (isTouch?'hold button to chop':'hold E to chop this tree')
                     : target.kind==='water' ? (isTouch?'tap to drink':'E to fill water')
                     : (isTouch?'tap to pick · hold to dig up':'E to pick · hold E to dig up');
}

/* ---------- debug ---------- */
let debugOn=false,fps=0,fAcc=0,fN=0;
function drawDebug(){
  if(!debugOn) return;
  const lines=[`fps ${fps.toFixed(0)}`,`pos ${player.x|0},${player.y|0}`,
    `trees ${trees.filter(t=>t.alive).length}/${trees.length}`,
    `bushes ${bushes.filter(b=>b.alive).length}/${bushes.length}`,
    `stumps ${stumps.length}`,`camps ${camps.length}`,`carry ${carried()}/${TUNING.carryMax}`];
  ctx.fillStyle='rgba(8,16,12,.74)'; ctx.fillRect(6,30,116,lines.length*10+8);
  ctx.fillStyle='#9fd3a6'; ctx.font='8px ui-monospace, Menlo, monospace'; ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,12,36+i*10));
}

/* ---------- loop ---------- */
let last=performance.now()/1000,acc=0,clock=0;
function step(dt){
  input.aimExplicit=false; input.moveX=0; input.moveY=0; input.act=false;
  readKeyboard(); readTouch();
  updateNeeds(dt); updatePlots(dt);
  updatePlayer(dt); updateAnimals(dt); updatePet(dt);
  updateInteraction(dt); updateCamera(dt);
  clock+=dt;
  if(petMessage){ petMessageT+=dt; if(petMessageT>4.5){petMessage=null;petMessageT=0;} }
}
function frame(now){
  now/=1000;
  let d=now-last; last=now;
  if(d>TUNING.maxFrameTime) d=TUNING.maxFrameTime;
  acc+=d;
  while(acc>=TUNING.fixedStep){step(TUNING.fixedStep);acc-=TUNING.fixedStep;}
  fAcc+=d;fN++; if(fAcc>=.5){fps=fN/fAcc;fAcc=0;fN=0;}
  drawFloor(); drawCamp(); drawBushes(); drawTrees(); drawAnimals(); drawPet();
  drawHighlight(); drawPlayer();
  drawSight(); drawPetFind(); drawEffects(d); drawHUD(); drawDebug();
  syncButton(); syncHint(); syncBag();
  if(document.body.classList.contains('building')) buildWood.textContent='You have '+bag.wood+' wood';
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
