<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1410">
<title>Forest Survival — Milestone 1</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    background:#070d0a;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;background:#070d0a}
  #touch{position:fixed;inset:0;display:none;z-index:10}
  body.touch #touch{display:block}
  .zone{position:absolute;top:0;bottom:0;width:50%}
  #zoneMove{left:0}#zoneAim{right:0}
  .stick{
    position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
    border:1px solid rgba(200,214,190,.16);background:rgba(200,214,190,.04);
    opacity:0;transition:opacity .12s ease;pointer-events:none;
  }
  .stick.on{opacity:1}
  .nub{
    position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;
    border-radius:50%;background:rgba(200,214,190,.15);border:1px solid rgba(200,214,190,.28);
  }
  #zoneAim .nub{background:rgba(240,200,140,.16);border-color:rgba(240,200,140,.36)}
  #hint{
    position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11px;
    letter-spacing:.14em;text-transform:uppercase;color:rgba(200,214,190,.28);
    pointer-events:none;z-index:11;
  }
  #rotate{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:14px;background:#070d0a;z-index:40;
    color:rgba(200,214,190,.45);font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;text-align:center;padding:0 32px;
  }
  body.portrait.touch #rotate{display:flex}
  #rotate .glyph{
    width:46px;height:74px;border:1px solid rgba(200,214,190,.28);border-radius:6px;
    animation:tip 2.4s ease-in-out infinite;
  }
  @keyframes tip{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (prefers-reduced-motion:reduce){#rotate .glyph{animation:none;transform:rotate(-90deg)}}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="touch">
  <div class="zone" id="zoneMove"><div class="stick" id="stickMove"><div class="nub" id="nubMove"></div></div></div>
  <div class="zone" id="zoneAim"><div class="stick" id="stickAim"><div class="nub" id="nubAim"></div></div></div>
</div>
<div id="hint">move · look · <span id="hintKey">` for debug</span></div>
<div id="rotate"><div class="glyph"></div><div>rotate device</div></div>

<script>
/* ============================================================
   FOREST SURVIVAL — Milestone 1
   Canvas + responsive scaling, fixed-timestep loop,
   unified keyboard/touch input, forest rendering,
   tree collision, and line-of-sight occlusion by trees.
   ============================================================ */

const TUNING = {
  viewW: 640, viewH: 360, tile: 16,

  worldTilesX: 150, worldTilesY: 150,
  seed: 20260814,
  treeDensity: 0.055,      // trees per tile, before clearing noise
  clearingScale: 0.055,    // lower = larger clearings
  clearingBias: 0.42,      // higher = more open forest

  // movement
  accel: 1400, friction: 1500, maxSpeed: 90, playerRadius: 5,

  // sight
  coneAngle: 0.50,         // half-angle, radians
  coneRange: 176,
  coneFeather: 6,
  ambientRadius: 30,
  gloom: 0.80,             // daytime canopy gloom opacity
  shadowSoft: 2.2,         // px of softening on tree shadow edges

  camLerp: 7.5,
  fixedStep: 1/60, maxFrameTime: .25,
};

/* ---------- seeded noise ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(TUNING.seed);

// cheap value noise for clearings
const NG = 256, ngrid = new Float32Array(NG*NG);
for(let i=0;i<NG*NG;i++) ngrid[i]=rnd();
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const g=(a,b)=>ngrid[((b%NG)+NG)%NG*NG+((a%NG)+NG)%NG];
  const s=t=>t*t*(3-2*t);
  const u=s(xf), v=s(yf);
  const a=g(xi,yi), b=g(xi+1,yi), c=g(xi,yi+1), d=g(xi+1,yi+1);
  return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;
}

/* ---------- canvas ---------- */
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d',{alpha:false});
canvas.width=TUNING.viewW; canvas.height=TUNING.viewH;
ctx.imageSmoothingEnabled=false;

const dark=document.createElement('canvas');
dark.width=TUNING.viewW; dark.height=TUNING.viewH;
const dctx=dark.getContext('2d');

let viewScale=1, viewLeft=0, viewTop=0;
function resize(){
  const vw=innerWidth, vh=innerHeight;
  let s=Math.min(vw/TUNING.viewW, vh/TUNING.viewH);
  if(s>=1) s=Math.floor(s);
  viewScale=s;
  canvas.style.width=Math.round(TUNING.viewW*s)+'px';
  canvas.style.height=Math.round(TUNING.viewH*s)+'px';
  const r=canvas.getBoundingClientRect();
  viewLeft=r.left; viewTop=r.top;
  document.body.classList.toggle('portrait', vh>vw);
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));

const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(isTouch) document.body.classList.add('touch');
document.getElementById('hintKey').textContent = isTouch ? 'left: move · right: look' : '` for debug';

/* ---------- forest ---------- */
const W=TUNING.worldTilesX, H=TUNING.worldTilesY, T=TUNING.tile;
const worldW=W*T, worldH=H*T;

const floorTone=new Float32Array(W*H);
for(let i=0;i<W*H;i++) floorTone[i]=rnd();

const trees=[];
const ferns=[];
(function grow(){
  const target=Math.floor(W*H*TUNING.treeDensity);
  let guard=0;
  while(trees.length<target && guard<target*12){
    guard++;
    const x=rnd()*worldW, y=rnd()*worldH;
    // clearings: skip where noise is low
    const n=vnoise(x*TUNING.clearingScale/T*4, y*TUNING.clearingScale/T*4);
    if(n < TUNING.clearingBias) continue;
    // don't stack trunks
    let ok=true;
    for(const t of trees){
      const dx=t.x-x, dy=t.y-y;
      if(dx*dx+dy*dy < 260){ ok=false; break; }
    }
    if(!ok) continue;
    const v=rnd();
    trees.push({
      x, y,
      canopy: 11+v*8,
      trunk: 3.2+v*1.8,
      tone: rnd(),
      lean: (rnd()-.5)*1.4,
    });
  }
  // undergrowth
  for(let i=0;i<W*H*0.09;i++){
    ferns.push({x:rnd()*worldW, y:rnd()*worldH, r:2+rnd()*3.5, t:rnd()});
  }
})();

// spatial buckets so occlusion doesn't scan every tree each frame
const BUCKET=64;
const bw=Math.ceil(worldW/BUCKET), bh=Math.ceil(worldH/BUCKET);
const buckets=Array.from({length:bw*bh},()=>[]);
for(const t of trees){
  const bx=Math.floor(t.x/BUCKET), by=Math.floor(t.y/BUCKET);
  buckets[by*bw+bx].push(t);
}
function treesNear(x,y,rad){
  const out=[];
  const x0=Math.max(0,Math.floor((x-rad)/BUCKET)), x1=Math.min(bw-1,Math.floor((x+rad)/BUCKET));
  const y0=Math.max(0,Math.floor((y-rad)/BUCKET)), y1=Math.min(bh-1,Math.floor((y+rad)/BUCKET));
  for(let by=y0;by<=y1;by++) for(let bx=x0;bx<=x1;bx++) out.push(...buckets[by*bw+bx]);
  return out;
}

/* ---------- input ---------- */
const input={moveX:0,moveY:0,aim:0,aimExplicit:false};
const keys=new Set();
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
  if(e.key==='`') debugOn=!debugOn;
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
addEventListener('blur',()=>keys.clear());

let mouseWorld=null;
canvas.addEventListener('mousemove',e=>{
  mouseWorld={x:(e.clientX-viewLeft)/viewScale+cam.x, y:(e.clientY-viewTop)/viewScale+cam.y};
});
canvas.addEventListener('mouseleave',()=>mouseWorld=null);

function readKeyboard(){
  let x=0,y=0;
  if(keys.has('a')||keys.has('arrowleft'))x-=1;
  if(keys.has('d')||keys.has('arrowright'))x+=1;
  if(keys.has('w')||keys.has('arrowup'))y-=1;
  if(keys.has('s')||keys.has('arrowdown'))y+=1;
  const m=Math.hypot(x,y); if(m>0){x/=m;y/=m;}
  input.moveX=x; input.moveY=y;
  if(mouseWorld){
    input.aim=Math.atan2(mouseWorld.y-player.y, mouseWorld.x-player.x);
    input.aimExplicit=true;
  }
}

const sticks={
  move:{id:null,ox:0,oy:0,dx:0,dy:0,el:document.getElementById('stickMove'),nub:document.getElementById('nubMove')},
  aim :{id:null,ox:0,oy:0,dx:0,dy:0,el:document.getElementById('stickAim'), nub:document.getElementById('nubAim')},
};
const STICK_MAX=46;
function moveNub(s){s.nub.style.transform=`translate(${s.dx}px,${s.dy}px)`;}
function release(s){s.id=null;s.dx=0;s.dy=0;s.el.classList.remove('on');moveNub(s);}
addEventListener('touchstart',e=>{
  for(const t of e.changedTouches){
    const s = t.clientX < innerWidth/2 ? sticks.move : sticks.aim;
    if(s.id!==null) continue;
    s.id=t.identifier;s.ox=t.clientX;s.oy=t.clientY;s.dx=0;s.dy=0;
    s.el.style.left=s.ox+'px'; s.el.style.top=s.oy+'px'; s.el.classList.add('on');
    moveNub(s);
  }
  e.preventDefault();
},{passive:false});
addEventListener('touchmove',e=>{
  for(const t of e.changedTouches) for(const k in sticks){
    const s=sticks[k]; if(s.id!==t.identifier) continue;
    let dx=t.clientX-s.ox, dy=t.clientY-s.oy;
    const d=Math.hypot(dx,dy);
    if(d>STICK_MAX){dx=dx/d*STICK_MAX;dy=dy/d*STICK_MAX;}
    s.dx=dx;s.dy=dy;moveNub(s);
  }
  e.preventDefault();
},{passive:false});
function endT(e){for(const t of e.changedTouches) for(const k in sticks) if(sticks[k].id===t.identifier) release(sticks[k]); e.preventDefault();}
addEventListener('touchend',endT,{passive:false});
addEventListener('touchcancel',endT,{passive:false});

function readTouch(){
  const m=sticks.move;
  if(m.id!==null){
    const d=Math.hypot(m.dx,m.dy), dead=8;
    if(d>dead){const n=Math.min(1,(d-dead)/(STICK_MAX-dead));input.moveX=m.dx/d*n;input.moveY=m.dy/d*n;}
  }
  const a=sticks.aim;
  if(a.id!==null && Math.hypot(a.dx,a.dy)>10){
    input.aim=Math.atan2(a.dy,a.dx); input.aimExplicit=true;
  }
}

/* ---------- player ---------- */
const player={x:0,y:0,vx:0,vy:0,facing:-Math.PI/2,bob:0};
(function spawn(){
  // start in a clearing near the middle
  let best=null;
  for(let i=0;i<400;i++){
    const x=worldW*.35+rnd()*worldW*.3, y=worldH*.35+rnd()*worldH*.3;
    let near=Infinity;
    for(const t of treesNear(x,y,60)){const d=Math.hypot(t.x-x,t.y-y);if(d<near)near=d;}
    if(!best||near>best.near) best={x,y,near};
    if(near>46) break;
  }
  player.x=best.x; player.y=best.y;
})();

function collide(){
  for(const t of treesNear(player.x,player.y,40)){
    const dx=player.x-t.x, dy=player.y-t.y;
    const min=t.trunk+TUNING.playerRadius;
    const d=Math.hypot(dx,dy);
    if(d<min && d>0.001){
      const push=(min-d);
      player.x+=dx/d*push; player.y+=dy/d*push;
      // kill velocity into the trunk
      const nx=dx/d, ny=dy/d;
      const dot=player.vx*nx+player.vy*ny;
      if(dot<0){player.vx-=nx*dot;player.vy-=ny*dot;}
    }
  }
}

function updatePlayer(dt){
  player.vx+=input.moveX*TUNING.accel*dt;
  player.vy+=input.moveY*TUNING.accel*dt;
  let sp=Math.hypot(player.vx,player.vy);
  if(sp>0){
    const drop=TUNING.friction*dt*((input.moveX||input.moveY)?0.35:1);
    const ns=Math.max(0,sp-drop);
    player.vx=player.vx/sp*ns; player.vy=player.vy/sp*ns;
  }
  sp=Math.hypot(player.vx,player.vy);
  if(sp>TUNING.maxSpeed){player.vx=player.vx/sp*TUNING.maxSpeed;player.vy=player.vy/sp*TUNING.maxSpeed;}
  player.x+=player.vx*dt; player.y+=player.vy*dt;
  player.x=Math.max(10,Math.min(worldW-10,player.x));
  player.y=Math.max(10,Math.min(worldH-10,player.y));
  collide();

  if(!input.aimExplicit && sp>6){
    const want=Math.atan2(player.vy,player.vx);
    let d=want-player.facing;
    while(d>Math.PI)d-=Math.PI*2; while(d<-Math.PI)d+=Math.PI*2;
    player.facing+=d*Math.min(1,dt*10);
  } else if(input.aimExplicit){
    player.facing=input.aim;
  }
  if(sp>6) player.bob+=dt*9;
}

/* ---------- camera ---------- */
const cam={x:0,y:0};
cam.x=player.x-TUNING.viewW/2; cam.y=player.y-TUNING.viewH/2;
function updateCamera(dt){
  const tx=player.x-TUNING.viewW/2, ty=player.y-TUNING.viewH/2;
  const k=1-Math.exp(-TUNING.camLerp*dt);
  cam.x+=(tx-cam.x)*k; cam.y+=(ty-cam.y)*k;
  cam.x=Math.max(0,Math.min(worldW-TUNING.viewW,cam.x));
  cam.y=Math.max(0,Math.min(worldH-TUNING.viewH,cam.y));
}

/* ---------- render ---------- */
function drawFloor(){
  const x0=Math.floor(cam.x/T), y0=Math.floor(cam.y/T);
  const x1=Math.ceil((cam.x+TUNING.viewW)/T), y1=Math.ceil((cam.y+TUNING.viewH)/T);
  for(let ty=y0;ty<=y1;ty++) for(let tx=x0;tx<=x1;tx++){
    if(tx<0||ty<0||tx>=W||ty>=H){ ctx.fillStyle='#060b08'; }
    else{
      const n=floorTone[ty*W+tx];
      const damp=vnoise(tx*.09,ty*.09);
      // moss over wet earth
      const r=Math.round(30+n*10+damp*8);
      const g=Math.round(40+n*14+damp*14);
      const b=Math.round(26+n*8+damp*6);
      ctx.fillStyle=`rgb(${r},${g},${b})`;
    }
    ctx.fillRect(Math.round(tx*T-cam.x),Math.round(ty*T-cam.y),T,T);
  }
  for(const f of ferns){
    const sx=f.x-cam.x, sy=f.y-cam.y;
    if(sx<-12||sy<-12||sx>TUNING.viewW+12||sy>TUNING.viewH+12) continue;
    ctx.fillStyle=f.t>.55?'rgba(86,112,64,.55)':'rgba(62,86,50,.5)';
    ctx.beginPath();
    ctx.ellipse(sx|0,sy|0,f.r,f.r*.62,f.t*3,0,Math.PI*2);
    ctx.fill();
  }
}

function drawTrees(){
  const list=treesNear(cam.x+TUNING.viewW/2, cam.y+TUNING.viewH/2, 460);
  list.sort((a,b)=>a.y-b.y);
  for(const t of list){
    const sx=t.x-cam.x, sy=t.y-cam.y;
    if(sx<-40||sy<-40||sx>TUNING.viewW+40||sy>TUNING.viewH+40) continue;
    // trunk base
    ctx.fillStyle='#241d16';
    ctx.beginPath(); ctx.ellipse(sx,sy,t.trunk+1.4,t.trunk*.78,0,0,Math.PI*2); ctx.fill();
    // canopy
    const c=t.tone;
    ctx.fillStyle=`rgb(${Math.round(24+c*14)},${Math.round(42+c*22)},${Math.round(26+c*12)})`;
    ctx.beginPath();
    ctx.ellipse(sx+t.lean, sy-t.canopy*.22, t.canopy, t.canopy*.88, 0, 0, Math.PI*2);
    ctx.fill();
    // top light
    ctx.fillStyle='rgba(150,186,116,.10)';
    ctx.beginPath();
    ctx.ellipse(sx+t.lean-t.canopy*.22, sy-t.canopy*.5, t.canopy*.52, t.canopy*.4, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawPlayer(){
  const sx=Math.round(player.x-cam.x), sy=Math.round(player.y-cam.y);
  const wob=Math.sin(player.bob)*.8;
  ctx.fillStyle='rgba(0,0,0,.36)';
  ctx.beginPath(); ctx.ellipse(sx,sy+4,6,3,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#c9c2ae';
  ctx.beginPath(); ctx.arc(sx,sy+wob,TUNING.playerRadius,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#f0c88c';
  ctx.beginPath();
  ctx.arc(sx+Math.cos(player.facing)*2.4, sy+wob+Math.sin(player.facing)*2.4, 2.1,0,Math.PI*2);
  ctx.fill();
}

/* --- the signature system: cone of sight, occluded by trunks --- */
function drawSight(){
  const px=player.x-cam.x, py=player.y-cam.y;

  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle=`rgba(8,16,12,${TUNING.gloom})`;
  dctx.fillRect(0,0,TUNING.viewW,TUNING.viewH);

  // carve the cone out of the gloom
  dctx.globalCompositeOperation='destination-out';
  const steps=TUNING.coneFeather;
  for(let i=0;i<steps;i++){
    const t=i/(steps-1);
    const half=TUNING.coneAngle*(1.45-.45*t);
    const rng=TUNING.coneRange*(.70+.30*t);
    const g=dctx.createRadialGradient(px,py,4,px,py,rng);
    const a=.17+t*.33;
    g.addColorStop(0,`rgba(0,0,0,${a})`);
    g.addColorStop(.55,`rgba(0,0,0,${a*.78})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    dctx.fillStyle=g;
    dctx.beginPath(); dctx.moveTo(px,py);
    dctx.arc(px,py,rng,player.facing-half,player.facing+half);
    dctx.closePath(); dctx.fill();
  }
  // ambient bubble
  const ga=dctx.createRadialGradient(px,py,2,px,py,TUNING.ambientRadius);
  ga.addColorStop(0,'rgba(0,0,0,.90)');
  ga.addColorStop(.5,'rgba(0,0,0,.52)');
  ga.addColorStop(1,'rgba(0,0,0,0)');
  dctx.fillStyle=ga;
  dctx.beginPath(); dctx.arc(px,py,TUNING.ambientRadius,0,Math.PI*2); dctx.fill();

  // put the gloom BACK behind every trunk — this is the occlusion
  dctx.globalCompositeOperation='source-over';
  dctx.fillStyle=`rgba(8,16,12,${TUNING.gloom})`;
  const far=TUNING.coneRange*1.9;
  for(const t of treesNear(player.x,player.y,TUNING.coneRange+30)){
    const dx=t.x-player.x, dy=t.y-player.y;
    const dist=Math.hypot(dx,dy);
    if(dist<=t.trunk||dist>TUNING.coneRange+30) continue;
    const a=Math.atan2(dy,dx);
    const spread=Math.asin(Math.min(1,(t.trunk+TUNING.shadowSoft)/dist));
    const a1=a-spread, a2=a+spread;
    const nd=dist*Math.cos(spread);
    const n1x=px+Math.cos(a1)*nd, n1y=py+Math.sin(a1)*nd;
    const n2x=px+Math.cos(a2)*nd, n2y=py+Math.sin(a2)*nd;
    const f1x=px+Math.cos(a1)*far, f1y=py+Math.sin(a1)*far;
    const f2x=px+Math.cos(a2)*far, f2y=py+Math.sin(a2)*far;
    dctx.beginPath();
    dctx.moveTo(n1x,n1y); dctx.lineTo(f1x,f1y); dctx.lineTo(f2x,f2y); dctx.lineTo(n2x,n2y);
    dctx.closePath(); dctx.fill();
  }

  ctx.drawImage(dark,0,0);

  // warm lamp bloom on top
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const gb=ctx.createRadialGradient(px,py,2,px,py,TUNING.coneRange*.55);
  gb.addColorStop(0,'rgba(240,200,140,.085)');
  gb.addColorStop(1,'rgba(240,200,140,0)');
  ctx.fillStyle=gb;
  ctx.beginPath(); ctx.moveTo(px,py);
  ctx.arc(px,py,TUNING.coneRange*.55,player.facing-TUNING.coneAngle*1.1,player.facing+TUNING.coneAngle*1.1);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawMist(t){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){
    const ox=(t*7+i*220)%(TUNING.viewW+300)-150;
    const oy=100+Math.sin(t*.25+i*2)*70;
    const g=ctx.createRadialGradient(ox,oy,10,ox,oy,150);
    g.addColorStop(0,'rgba(150,175,150,.030)');
    g.addColorStop(1,'rgba(150,175,150,0)');
    ctx.fillStyle=g;
    ctx.fillRect(ox-150,oy-150,300,300);
  }
  ctx.restore();
}

/* ---------- debug ---------- */
let debugOn=false, fps=0, fAcc=0, fN=0;
function drawDebug(){
  if(!debugOn) return;
  const lines=[
    `fps    ${fps.toFixed(0)}`,
    `pos    ${player.x|0}, ${player.y|0}`,
    `vel    ${Math.hypot(player.vx,player.vy).toFixed(1)}`,
    `trees  ${trees.length}`,
    `near   ${treesNear(player.x,player.y,TUNING.coneRange).length}`,
    `face   ${(player.facing*180/Math.PI)|0}°`,
    `scale  ${viewScale.toFixed(2)}x`,
  ];
  ctx.fillStyle='rgba(8,16,12,.74)';
  ctx.fillRect(6,6,110,lines.length*10+8);
  ctx.fillStyle='#9fd3a6';
  ctx.font='8px ui-monospace, Menlo, monospace';
  ctx.textBaseline='top';
  lines.forEach((l,i)=>ctx.fillText(l,12,12+i*10));
}

/* ---------- loop ---------- */
let last=performance.now()/1000, acc=0, clock=0;
function step(dt){
  input.aimExplicit=false; input.moveX=0; input.moveY=0;
  readKeyboard(); readTouch();
  updatePlayer(dt); updateCamera(dt);
  clock+=dt;
}
function frame(now){
  now/=1000;
  let d=now-last; last=now;
  if(d>TUNING.maxFrameTime) d=TUNING.maxFrameTime;
  acc+=d;
  while(acc>=TUNING.fixedStep){ step(TUNING.fixedStep); acc-=TUNING.fixedStep; }
  fAcc+=d; fN++;
  if(fAcc>=.5){ fps=fN/fAcc; fAcc=0; fN=0; }

  drawFloor();
  drawTrees();
  drawPlayer();
  drawSight();
  drawMist(clock);
  drawDebug();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
